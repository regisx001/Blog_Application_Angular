<section>
  <h1 class="text-3xl font-bold py-10">Users Management</h1>

  @if(!error){
  <p-table [value]="data" [tableStyle]="{ 'min-width': '50rem' }">
    <ng-template #header>
      <tr>
        <th>Identifier</th>
        <th>Username</th>
        <th>Email</th>
        <th>Enabled</th>
        <th>Created At</th>
        <th>Updated At</th>
      </tr>
    </ng-template>
    <ng-template #body let-user>
      <tr>
        <td>{{ user.id }}</td>
        <td>{{ user.username }}</td>
        <td>{{ user.email }}</td>
        <td>{{ user.enabled }}</td>
        <td>{{ timeAgo(user.createdAt) }}</td>
        <td>{{ timeAgo(user.updatedAt) }}</td>
      </tr>
    </ng-template>
  </p-table>
  }@else {
  <h1 class="text-red-600 font-bold">{{ error }}</h1>
  }
</section>
